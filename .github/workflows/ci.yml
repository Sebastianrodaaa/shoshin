name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: models
          key: warc-fold-checkpoints-v1
      - name: setup (CPU torch, WARC, fold checkpoints)
        run: make setup PY=python
      - name: lint
        run: pip install pyflakes && python -m pyflakes shoshin scripts app test_shoshin.py
      - name: test (real ft09 recording, fold3 checkpoint, CPU)
        run: make test PY=python
